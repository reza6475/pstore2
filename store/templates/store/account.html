{%extends "base.html"%}
{%load static %}
{%block header_refrences %}
<link rel="stylesheet" href="{% static 'store/css/account.css'%}">
{%endblock%}
  {% block title %} حساب کاربری   {%endblock%}
{%block content %}
<h1>حساب کاربری</h1>
<form method="POST">
  {% csrf_token %}
  <label for="email">پست الکترونیکی</label>
  <input type="email" name="email" id="email" value="{{request.user.email}}">

  <label for="currentpassword">رمز عبور فعلی</label>
  <input type="password" name="currentpassword" id="currentpassword" >

  <label for="password">رمز عبور جدید</label>
  <input type="password" name="password" id="password" >

  <label for="confirmpassword">تایید رمز عیور جدید</label>
  <input type="password" name="confirmpassword" id="confirmpassword">


  <button type="submit"> تایید</button>
</form>

{% endblock %}
